name: Release

on:
  workflow_dispatch:
  push:
    tags:
      - 'v*'

env:
  CARGO_TERM_COLOR: always
  RUST_BACKTRACE: 1

jobs:
  # --------------------------------------------------------------------------
  # Build Flatpak bundle and publish a GitHub Release
  # --------------------------------------------------------------------------
  flatpak:
    name: Flatpak
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Install Flatpak and flatpak-builder
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends \
            dbus-x11 \
            flatpak \
            flatpak-builder \
            python3 \
            python3-pip \
            python3-venv \
            maven \
            ant \
            elfutils \
            librsvg2-common

      - name: Install flathub-build tool
        run: |
          flatpak remote-add --user --if-not-exists flathub https://dl.flathub.org/repo/flathub.flatpakrepo
          flatpak install --user -y flathub \
            org.flatpak.Builder \
            org.gnome.Sdk//50 \
            org.freedesktop.Sdk.Extension.openjdk//25.08

      - name: Start dbus
        run: |
          eval $(dbus-launch --sh-syntax)
          echo "DBUS_SESSION_BUS_ADDRESS=$DBUS_SESSION_BUS_ADDRESS" >> $GITHUB_ENV

      - name: Cache flatpak-builder downloads
        uses: actions/cache@v4
        with:
          path: .flatpak-builder/downloads
          key: flatpak-downloads-${{ hashFiles('flatpak/*-sources.json') }}
          restore-keys: |
            flatpak-downloads-

      - name: Download Flatpak sources
        uses: nick-fields/retry@v3
        with:
          timeout_minutes: 60
          max_attempts: 5
          retry_wait_seconds: 90
          command: ./b flatpak-download

      - name: Build Flatpak bundle
        run: ./b flatpak-build

      - name: Create or update GitHub Release
        if: github.ref_type == 'tag'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |-
          gh release upload "${{ github.ref_name }}" flatpak/Eventix.flatpak --clobber || \
          gh release create "${{ github.ref_name }}" \
            --title "${{ github.ref_name }}" \
            --generate-notes \
            flatpak/Eventix.flatpak
